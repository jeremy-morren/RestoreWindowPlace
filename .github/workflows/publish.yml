name: Publish NuGet package

# A release is assembled and checked before it is published.
# Publishing its draft is the explicit release decision; this workflow then pushes the package attached to it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Push RestoreWindowPosition to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      PACKAGE_ID: RestoreWindowPosition
    steps:
      - name: Download the package from the release
        run: gh release download "$TAG" --pattern '*.nupkg' --dir package

      # The release asset must identify one package whose version agrees with the release tag.
      # NuGet packages cannot be replaced, so this prevents an accidental manual release from publishing an unintended version.
      - name: Check the package matches the tag
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(package/"$PACKAGE_ID".[0-9]*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one $PACKAGE_ID package on release $TAG, found ${#packages[@]}." >&2
            exit 1
          fi

          package=${packages[0]}
          version=$(basename "$package" .nupkg)
          version=${version#"$PACKAGE_ID".}
          if [ "v$version" != "$TAG" ]; then
            echo "$PACKAGE_ID is v$version but the release is tagged $TAG." >&2
            exit 1
          fi

          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE_ID v$version"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
